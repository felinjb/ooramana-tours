<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ooramana Heritage | Home</title>
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #4a5d23;
            --bg: #f9f9f7;
            --text: #333333;
        }
        body {
            margin: 0;
            font-family: 'Georgia', serif;
            background-color: var(--bg);
            color: var(--text);
        }
        /* Interactive Navigation Bar */
        nav {
            background-color: var(--primary);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-family: 'Arial', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }
        nav a:hover {
            color: var(--secondary);
        }
        /* Cinematic Hero Section */
        .hero {
            height: 90vh;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?auto=format&fit=crop&w=1600&q=80') center/cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }
        .hero h1 {
            font-size: 4rem;
            letter-spacing: 3px;
            margin-bottom: 0;
        }
        .hero p {
            font-size: 1.2rem;
            font-family: 'Arial', sans-serif;
            letter-spacing: 4px;
            margin-top: 10px;
        }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background-color: var(--secondary);
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Arial', sans-serif;
            transition: transform 0.3s, background-color 0.3s;
        }
        .btn:hover {
            background-color: #3a4a1c;
            transform: scale(1.05); /* Interactive pop effect */
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="tours.html">Our Tours</a>
        <a href="mailto:your-email@example.com">Contact</a>
    </nav>

    <header class="hero">
        <h1>Ooramana Heritage</h1>
        <p>EXPERIENCE THE SOUL OF KERALA</p>
        <a href="tours.html" class="btn">Explore Packages</a>
    </header>

</body>
</html>
