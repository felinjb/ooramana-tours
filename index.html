<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ooramana Heritage | 3D Minimal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e0e5ec;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --accent: #3E7C59;
            /* 3D Shadows */
            --shadow-out: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5);
            --shadow-in: inset 6px 6px 10px 0 rgba(163,177,198, 0.7), inset -6px -6px 10px 0 rgba(255,255,255, 0.8);
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* 3D Navigation */
        nav {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg);
            box-shadow: var(--shadow-out);
            border-radius: 0 0 20px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            margin-left: 30px;
            font-weight: 400;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 20px;
        }

        /* Floating 3D Card */
        .hero-card {
            background-color: var(--bg);
            border-radius: 30px;
            box-shadow: var(--shadow-out);
            padding: 50px;
            text-align: center;
            margin-bottom: 60px;
            animation: floatUp 1s ease-out;
        }

        .hero-card h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--text-dark);
        }

        .hero-card p {
            color: var(--text-light);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        /* 3D Button */
        .btn {
            display: inline-block;
            background-color: var(--bg);
            color: var(--accent);
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: var(--shadow-out);
            transition: all 0.2s ease;
        }

        .btn:hover {
            color: var(--text-dark);
        }

        .btn:active {
            box-shadow: var(--shadow-in);
        }

        /* Floating Image Frame */
        .image-frame {
            border-radius: 20px;
            padding: 10px;
            background: var(--bg);
            box-shadow: var(--shadow-out);
            display: inline-block;
            margin-top: 30px;
        }

        .image-frame img {
            border-radius: 15px;
            display: block;
            max-width: 100%;
            height: auto;
            opacity: 0.9;
        }

        /* Simple Animations */
        @keyframes floatUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">OORAMANA</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="packages.html">Experiences</a>
        </div>
    </nav>

    <div class="container">
        <div class="hero-card">
            <h1>The Soul of Kerala</h1>
            <p>Step into the peaceful rhythm of Ooramana. Uncover ancient heritage, hands-on craft workshops, and untouched natural beauty through our curated village journeys.</p>
            <a href="packages.html" class="btn">View Packages</a>
            
            <div class="image-frame">
                <img src="https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?auto=format&fit=crop&w=800&q=80" alt="Kerala Backwaters">
            </div>
        </div>
    </div>

</body>
</html>
